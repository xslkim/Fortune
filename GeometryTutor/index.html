<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>立体几何课堂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: #1f2d3d; background: #eef2f7;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 8px 14px; background: #1f3a5f; color: #fff;
    }
    header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
    #tabs { display: flex; gap: 8px; margin-left: auto; }
    .tab {
      min-height: 44px; padding: 0 22px; font-size: 16px; border: none; border-radius: 8px;
      background: rgba(255,255,255,.15); color: #fff; cursor: pointer;
    }
    .tab.active { background: #fff; color: #1f3a5f; font-weight: 600; }

    main { flex: 1; display: flex; min-height: 0; }
    #stage { flex: 1; position: relative; min-width: 0; min-height: 0; }
    #panel {
      width: 400px; max-width: 45vw; overflow-y: auto;
      background: #fff; padding: 16px; border-left: 1px solid #dde4ee;
    }

    .geo-viewer { touch-action: none; }
    .geo-canvas { display: block; touch-action: none; }
    .geo-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .vtx-label {
      position: absolute; left: 0; top: 0; font-size: 14px; font-weight: 600;
      color: #274156; text-shadow: 0 0 4px #fff, 0 0 4px #fff; white-space: nowrap;
    }
    .vtx-label.dim { opacity: .3; }
    .vtx-label.hl { color: #e8491d; }

    .panel-title { font-size: 20px; margin-bottom: 12px; }
    .muted { color: #8a97a8; font-size: 13px; }

    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      min-height: 44px; padding: 14px 16px; font-size: 16px; text-align: left;
      background: #f4f7fb; border: 1px solid #dde4ee; border-radius: 12px; cursor: pointer;
    }
    .card:hover { background: #e8eff9; border-color: #b9cbe4; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #dde4ee; }
    .badge.diff-1 { background: #d8f3dc; color: #2d6a4f; }
    .badge.diff-2 { background: #fff3cd; color: #9c6b00; }
    .badge.diff-3 { background: #f8d7da; color: #9c1c24; }
    .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge.st-ok { background: #d8f3dc; color: #2d6a4f; }
    .badge.st-wrong { background: #f8d7da; color: #9c1c24; }
    .badge.st-none { background: #eef1f6; color: #8a97a8; }
    .badge.st-doing { background: #dbe7fb; color: #2f6fdd; }

    /* 课程卡（含进度与继续按钮）与错题卡 */
    .lesson-card, .wrong-card { flex-direction: row; align-items: center; justify-content: space-between; }
    .wrong-card { cursor: default; }
    .card-main { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
    .wrong-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* 学习统计条：移动端允许换行 */
    .stat-bar { margin: 0 0 14px; flex-wrap: wrap; }
    .stat-bar .stat { min-width: 88px; }

    /* 三视图浮层：叠加在 3D 区左下角，不拦截拖动；手机上占满宽度 */
    .view-pane {
      position: absolute; left: 12px; bottom: 12px;
      width: min(46%, 440px); padding: 8px 10px;
      background: rgba(255,255,255,.94); border: 1px solid #dde4ee; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(31,58,95,.10); pointer-events: none;
    }
    .view-pane svg { display: block; width: 100%; height: auto; }
    @media (max-width: 720px) {
      /* 手机上缩为小浮层，与 3D 模型同屏可见（占满宽度会把模型全挡住） */
      .view-pane { left: 8px; bottom: 8px; width: min(58%, 300px); }
      .view-pane svg { max-height: calc(45vh - 20px); }
    }

    .btn {
      min-height: 44px; padding: 0 18px; font-size: 15px; border-radius: 10px;
      border: 1px solid #c3cfdf; background: #fff; color: #1f2d3d; cursor: pointer;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-primary { background: #2f6fdd; border-color: #2f6fdd; color: #fff; }
    .btn-ghost { border: none; background: none; color: #2f6fdd; padding: 0 8px; }
    .btn-small { min-height: 36px; padding: 0 12px; font-size: 14px; }
    .btn-block { width: 100%; margin-top: 12px; }

    .player-head { margin-bottom: 12px; }
    .player-title h2 { font-size: 19px; margin: 6px 0 2px; }
    .audio-bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .rate-select { min-height: 36px; font-size: 14px; border-radius: 8px; border: 1px solid #c3cfdf; padding: 0 6px; }
    .tts-toggle { display: flex; align-items: center; font-size: 14px; color: #4a5a6d; min-height: 36px; }
    .tts-toggle input { width: 18px; height: 18px; }

    .step-body { font-size: 16px; line-height: 1.8; margin: 12px 0; }
    .step-body strong { color: #1f3a5f; }
    .step-nav {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-top: 16px; padding-top: 12px; border-top: 1px solid #eef1f6;
    }

    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

    .option-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .option {
      min-height: 48px; padding: 10px 16px; font-size: 16px; text-align: left;
      border: 1px solid #c3cfdf; border-radius: 10px; background: #fff; cursor: pointer;
    }
    .option:hover:not(:disabled) { background: #f0f5fc; }
    .option.correct { background: #d8f3dc; border-color: #2d6a4f; color: #2d6a4f; font-weight: 600; }
    .option.wrong { background: #f8d7da; border-color: #9c1c24; color: #9c1c24; }
    .result { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 15px; }
    .result.ok { background: #d8f3dc; color: #2d6a4f; }
    .result.no { background: #f8d7da; color: #9c1c24; }

    .lab-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .lab-select { min-height: 44px; font-size: 16px; border-radius: 10px; border: 1px solid #c3cfdf; padding: 0 10px; flex: 1; }
    .lab-toggles { gap: 14px; }
    .lab-toggle { display: flex; align-items: center; font-size: 15px; min-height: 44px; cursor: pointer; }
    .lab-toggle input { width: 20px; height: 20px; }
    .lab-slider input[type=range] { flex: 1; min-width: 140px; height: 32px; }

    .stats { display: flex; gap: 10px; margin: 16px 0 10px; }
    .stat {
      flex: 1; text-align: center; padding: 12px 4px;
      background: #f4f7fb; border-radius: 12px; border: 1px solid #dde4ee;
    }
    .stat strong { display: block; font-size: 24px; color: #1f3a5f; }
    .stat span { font-size: 13px; color: #8a97a8; }
    .euler { padding: 12px 14px; border-radius: 10px; font-size: 15px; }
    .euler.ok { background: #d8f3dc; color: #2d6a4f; }
    .euler.no { background: #fff3cd; color: #9c6b00; }
    .lab-hint { margin-top: 12px; }

    /* 手机竖屏：上下分栏 */
    @media (max-width: 720px) {
      header { padding: 6px 10px; gap: 8px; }
      header h1 { font-size: 16px; }
      #tabs { width: 100%; }
      .tab { flex: 1; min-height: 48px; padding: 0; }
      main { flex-direction: column; }
      #stage { flex: none; height: 45vh; }
      #panel { width: 100%; max-width: none; flex: 1; border-left: none; border-top: 1px solid #dde4ee; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <header>
    <h1>立体几何课堂</h1>
    <nav id="tabs"></nav>
  </header>
  <main>
    <div id="stage"></div>
    <div id="panel"></div>
  </main>
  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
